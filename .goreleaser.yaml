version: 2

project_name: docsclaw

before:
  hooks:
    - go mod tidy
    - go test ./...

builds:
  - id: docsclaw
    main: ./cmd/docsclaw
    binary: docsclaw
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X github.com/redhat-et/docsclaw/internal/cmd.version={{.Version}}

archives:
  - formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

release:
  github:
    owner: redhat-et
    name: docsclaw
  # Mark -rc/-beta tags as prereleases so they can be promoted later.
  prerelease: auto

homebrew_casks:
  - name: docsclaw
    # Don't move the tap cask to a prerelease tag.
    skip_upload: auto
    binaries:
      - docsclaw
    repository:
      owner: pavelanni
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    homepage: https://github.com/redhat-et/docsclaw
    description: Universal AI agent runtime with ConfigMap-driven personality
    # The macOS binaries are not notarized; clear the quarantine bit on install.
    hooks:
      post:
        install_steps: |
          on_macos do
            run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ .StagedPath }}/docsclaw"]
          end

# One multi-arch manifest per variant; `latest` follows stable tags only.
# Artifacts are staged at $TARGETPLATFORM/, so both Dockerfiles copy from there.
dockers_v2:
  - id: docsclaw
    ids: [docsclaw]
    dockerfile: Dockerfile.release
    images:
      - "ghcr.io/redhat-et/docsclaw"
    tags:
      - "{{ .Version }}"
      - "{{ if not .Prerelease }}latest{{ end }}"
    platforms: [linux/amd64, linux/arm64]
    flags: ["--provenance=false"]
    sbom: false
  - id: docsclaw-openshell
    ids: [docsclaw]
    dockerfile: Containerfile.openshell
    images:
      - "ghcr.io/redhat-et/docsclaw"
    tags:
      - "{{ .Version }}-openshell"
    platforms: [linux/amd64, linux/arm64]
    flags: ["--provenance=false"]
    sbom: false
