tools:
  allowed:
    - exec
    - web_fetch
    - read_file
    - write_file
    - fetch_document
  exec:
    timeout: 30
    max_output: 50000
  web_fetch:
    allowed_hosts:
      - ".s3.amazonaws.com"
      - ".svc.cluster.local"
  workspace: /workspace

document_services:
  research: http://localhost:8080

loop:
  max_iterations: 10
